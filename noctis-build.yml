name: Build Noctis Client

on:
  workflow_dispatch:
  push:
    paths:
      - "noctis-client-complete-1.zip"
      - ".github/workflows/noctis-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract Noctis project
        run: |
          test -f noctis-client-complete-1.zip
          mkdir extracted
          unzip -q noctis-client-complete-1.zip -d extracted

      - name: Build Fabric client
        run: |
          GRADLEW="$(find extracted -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: Gradle wrapper not found in ZIP"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLEW")"
          chmod +x "$GRADLEW"
          cd "$PROJECT_DIR"
          ./gradlew build --no-daemon

      - name: Upload built JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: noctis-client-jar
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
          
